services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  app:
    build:
      context: .
      args:
        SETUPTOOLS_SCM_PRETEND_VERSION: ${SETUPTOOLS_SCM_PRETEND_VERSION:-0.0.0}
    image: yt-dlp-server:latest
    pull_policy: build
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - "./out:/out"
      - "./data:/data"
    environment:
      MAX_RUNNING: "1"
      OUTPUT_DIR: "/out"
      DATABASE_PATH: "/data/jobs.sqlite3"
      POT_BASE_URL: "http://pot-provider:4416"
    depends_on:
      pot-provider:
        condition: service_healthy
