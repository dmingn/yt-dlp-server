[project]
name = "yt-dlp-server"
dynamic = ["version"]
description = "Minimal web UI to download videos with yt-dlp"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.52.0",
    "yt-dlp[default,deno]>=2026.7.4",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["yt_dlp_server"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "E501",
    "BLE001",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.14"
packages = ["yt_dlp_server"]
strict = true

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.20.2",
    "playwright>=1.62.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.12.0",
]
