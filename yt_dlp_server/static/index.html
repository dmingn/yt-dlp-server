<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yt-dlp-server</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f4f1;
        --fg: #1c1b19;
        --muted: #5c574f;
        --border: #cfc8bc;
        --accent: #0b6e4f;
        --danger: #8b2e2e;
        --panel: #fffdf9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161513;
          --fg: #f3efe7;
          --muted: #b0a99c;
          --border: #3a362f;
          --accent: #5dcaa0;
          --danger: #e28b8b;
          --panel: #1f1d1a;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.45;
      }
      main {
        max-width: 52rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.25rem;
      }
      h1 .version {
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 500;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 1.25rem;
        font-size: 0.95rem;
      }
      nav.tabs {
        display: flex;
        gap: 1rem;
        margin: 0 0 1.25rem;
      }
      nav.tabs a {
        color: var(--muted);
        text-decoration: none;
      }
      nav.tabs a.active {
        color: var(--fg);
        font-weight: 700;
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }
      form.wrap {
        flex-wrap: wrap;
      }
      input[type="url"],
      input[type="datetime-local"] {
        flex: 1;
        min-width: 0;
        padding: 0.7rem 0.8rem;
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        background: var(--panel);
        color: var(--fg);
        font: inherit;
      }
      button {
        padding: 0.7rem 1rem;
        border: 0;
        border-radius: 0.4rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error {
        color: var(--danger);
        margin: 0 0 1rem;
        font-size: 0.9rem;
      }
      .jobs {
        display: grid;
        gap: 0.75rem;
      }
      article {
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--panel);
        padding: 0.85rem 1rem;
      }
      article.selected {
        outline: 2px solid var(--accent);
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        align-items: baseline;
      }
      .url {
        word-break: break-all;
        font-weight: 600;
      }
      .meta {
        color: var(--muted);
        font-size: 0.85rem;
        margin-top: 0.35rem;
      }
      .status {
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        font-weight: 700;
      }
      button.secondary {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
        padding: 0.35rem 0.65rem;
        font-size: 0.8rem;
      }
      button.danger {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 45%, var(--border));
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.65rem;
      }
      .log-header {
        display: flex;
        justify-content: flex-end;
        margin: 0.75rem 0 0;
      }
      pre {
        margin: 0.35rem 0 0;
        padding: 0.75rem;
        border-radius: 0.35rem;
        background: color-mix(in srgb, var(--fg) 6%, transparent);
        overflow: auto;
        max-height: 18rem;
        font-size: 0.8rem;
        white-space: pre-wrap;
      }
      .empty {
        color: var(--muted);
      }
      .hint {
        color: var(--muted);
        margin: -0.75rem 0 1.25rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>yt-dlp-server <span class="version">__VERSION__</span></h1>
      <p class="sub">
        Paste a video URL to download with the server’s fixed yt-dlp settings.
        Use Schedules to start at a chosen time.
      </p>
      <nav class="tabs">
        <a id="jobs-nav" href="#jobs">Jobs</a>
        <a id="schedules-nav" href="#schedules">Schedules</a>
      </nav>
      <p id="form-error" class="error" hidden></p>
      <div id="jobs-view">
        <form id="submit-form">
          <input
            id="url-input"
            type="url"
            name="url"
            placeholder="https://..."
            required
            autocomplete="off"
          />
          <button type="submit" id="submit-btn">Download</button>
        </form>
        <section id="jobs" class="jobs" aria-live="polite"></section>
      </div>
      <div id="schedules-view" hidden>
        <form id="schedule-form" class="wrap">
          <input
            id="schedule-url-input"
            type="url"
            name="url"
            placeholder="https://..."
            required
            autocomplete="off"
          />
          <input
            id="schedule-at-input"
            type="datetime-local"
            required
            aria-describedby="schedule-tz-hint"
          />
          <button type="submit" id="schedule-btn">Schedule</button>
        </form>
        <p id="schedule-tz-hint" class="hint"></p>
        <section id="schedules" class="jobs" aria-live="polite"></section>
      </div>
    </main>
    <script>
      const form = document.getElementById("submit-form");
      const urlInput = document.getElementById("url-input");
      const submitBtn = document.getElementById("submit-btn");
      const scheduleForm = document.getElementById("schedule-form");
      const scheduleUrlInput = document.getElementById("schedule-url-input");
      const scheduleAtInput = document.getElementById("schedule-at-input");
      const scheduleBtn = document.getElementById("schedule-btn");
      const formError = document.getElementById("form-error");
      const jobsEl = document.getElementById("jobs");
      const schedulesEl = document.getElementById("schedules");
      const jobsView = document.getElementById("jobs-view");
      const schedulesView = document.getElementById("schedules-view");
      const jobsNav = document.getElementById("jobs-nav");
      const schedulesNav = document.getElementById("schedules-nav");
      let selectedId = null;
      let selectedDetail = null;

      function showError(message) {
        formError.hidden = !message;
        formError.textContent = message || "";
      }

      function formatTime(iso) {
        if (!iso) return "—";
        return new Date(iso).toLocaleString(undefined, { hour12: false });
      }

      function localTimezoneHint() {
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const offsetPart = new Intl.DateTimeFormat("en-US", {
          timeZoneName: "longOffset",
        })
          .formatToParts(new Date())
          .find((part) => part.type === "timeZoneName");
        const offset = offsetPart ? offsetPart.value : "";
        return `Times are this browser’s local timezone (${timeZone}, ${offset}).`;
      }

      function pad2(n) {
        return String(n).padStart(2, "0");
      }

      function toDatetimeLocalValue(iso) {
        const d = new Date(iso);
        return (
          `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}` +
          `T${pad2(d.getHours())}:${pad2(d.getMinutes())}`
        );
      }

      function currentView() {
        return location.hash === "#schedules" ? "schedules" : "jobs";
      }

      function applyView() {
        const view = currentView();
        jobsView.hidden = view !== "jobs";
        schedulesView.hidden = view !== "schedules";
        jobsNav.classList.toggle("active", view === "jobs");
        schedulesNav.classList.toggle("active", view === "schedules");
      }

      async function refreshJobs() {
        const res = await fetch("/api/listJobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        if (!res.ok) throw new Error("Failed to load jobs");
        const jobs = await res.json();
        if (selectedId) {
          const detailRes = await fetch("/api/getJob", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: selectedId }),
          });
          selectedDetail = detailRes.ok ? await detailRes.json() : null;
          if (!selectedDetail) selectedId = null;
        }
        renderJobs(jobs.filter((job) => job.status !== "scheduled"));
        renderSchedules(
          jobs
            .filter((job) => job.status === "scheduled")
            .sort((a, b) => a.scheduled_at.localeCompare(b.scheduled_at)),
        );
      }

      function captureLogScroll() {
        const article = jobsEl.querySelector("article.selected");
        const pre = article && article.querySelector("pre");
        if (!pre) return { id: null, stick: true, top: 0 };
        const threshold = 24;
        return {
          id: article.dataset.jobId,
          stick:
            pre.scrollTop + pre.clientHeight >= pre.scrollHeight - threshold,
          top: pre.scrollTop,
        };
      }

      function restoreLogScroll(pre, previous) {
        pre.scrollTop =
          previous.id !== selectedId || previous.stick
            ? pre.scrollHeight
            : previous.top;
      }

      function renderJobs(jobs) {
        const previousLogScroll = captureLogScroll();
        const pageY = window.scrollY;
        if (!jobs.length) {
          jobsEl.innerHTML = '<p class="empty">No jobs yet.</p>';
          return;
        }
        jobsEl.innerHTML = "";
        for (const job of jobs) {
          const article = document.createElement("article");
          article.dataset.jobId = job.id;
          if (job.id === selectedId) article.classList.add("selected");
          article.tabIndex = 0;
          article.innerHTML = `
            <div class="row">
              <div class="url">${escapeHtml(job.url)}</div>
              <div class="status">${escapeHtml(job.status)}</div>
            </div>
            <div class="meta">
              created ${formatTime(job.created_at)}
              ${job.scheduled_at ? " · scheduled " + formatTime(job.scheduled_at) : ""}
              · logs ${job.log_line_count}
              ${job.error ? " · " + escapeHtml(job.error) : ""}
            </div>
          `;
          if (job.status === "queued" || job.status === "running") {
            const actions = document.createElement("div");
            actions.className = "actions";
            actions.appendChild(cancelButton(job.id));
            article.appendChild(actions);
          }
          if (job.id === selectedId && selectedDetail) {
            const logText =
              (selectedDetail.log?.lines || []).join("") ||
              "(no log output yet)";
            const logHeader = document.createElement("div");
            logHeader.className = "log-header";
            const copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "secondary";
            copyBtn.textContent = "Copy log";
            copyBtn.addEventListener("click", async (event) => {
              event.stopPropagation();
              try {
                await navigator.clipboard.writeText(logText);
                copyBtn.textContent = "Copied";
                setTimeout(() => {
                  copyBtn.textContent = "Copy log";
                }, 1500);
              } catch {
                copyBtn.textContent = "Copy failed";
                setTimeout(() => {
                  copyBtn.textContent = "Copy log";
                }, 1500);
              }
            });
            logHeader.appendChild(copyBtn);
            const pre = document.createElement("pre");
            pre.textContent = logText;
            article.appendChild(logHeader);
            article.appendChild(pre);
          }
          article.addEventListener("click", () => selectJob(job.id));
          article.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              selectJob(job.id);
            }
          });
          jobsEl.appendChild(article);
        }
        const pre = jobsEl.querySelector("article.selected pre");
        if (pre) restoreLogScroll(pre, previousLogScroll);
        window.scrollTo(0, pageY);
      }

      function cancelButton(jobId) {
        const cancelBtn = document.createElement("button");
        cancelBtn.type = "button";
        cancelBtn.className = "secondary danger";
        cancelBtn.textContent = "Cancel";
        cancelBtn.addEventListener("click", async (event) => {
          event.stopPropagation();
          cancelBtn.disabled = true;
          try {
            const res = await fetch("/api/cancelJob", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: jobId }),
            });
            if (!res.ok) {
              throw new Error("Cancel failed");
            }
            await refreshJobs();
          } catch {
            cancelBtn.disabled = false;
            cancelBtn.textContent = "Cancel failed";
            setTimeout(() => {
              cancelBtn.textContent = "Cancel";
            }, 1500);
          }
        });
        return cancelBtn;
      }

      function renderSchedules(jobs) {
        const active = document.activeElement;
        // Skip redraw while a row datetime is focused so poll does not reset it.
        if (
          active &&
          schedulesEl.contains(active) &&
          active.tagName === "INPUT"
        ) {
          return;
        }
        if (!jobs.length) {
          schedulesEl.innerHTML = '<p class="empty">No schedules yet.</p>';
          return;
        }
        schedulesEl.innerHTML = "";
        for (const job of jobs) {
          const article = document.createElement("article");
          article.dataset.jobId = job.id;
          article.innerHTML = `
            <div class="row">
              <div class="url">${escapeHtml(job.url)}</div>
              <div class="status">${escapeHtml(job.status)}</div>
            </div>
            <div class="meta">scheduled ${formatTime(job.scheduled_at)}</div>
          `;
          const actions = document.createElement("div");
          actions.className = "actions";
          const atInput = document.createElement("input");
          atInput.type = "datetime-local";
          atInput.setAttribute("aria-describedby", "schedule-tz-hint");
          atInput.value = toDatetimeLocalValue(job.scheduled_at);
          const saveBtn = document.createElement("button");
          saveBtn.type = "button";
          saveBtn.className = "secondary";
          saveBtn.textContent = "Save";
          saveBtn.addEventListener("click", async () => {
            showError("");
            saveBtn.disabled = true;
            try {
              const res = await fetch("/api/rescheduleJob", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  id: job.id,
                  scheduled_at: new Date(atInput.value).toISOString(),
                }),
              });
              if (!res.ok) {
                throw new Error("Reschedule failed");
              }
              await refreshJobs();
            } catch (err) {
              saveBtn.disabled = false;
              showError(err.message || String(err));
            }
          });
          actions.appendChild(atInput);
          actions.appendChild(saveBtn);
          actions.appendChild(cancelButton(job.id));
          article.appendChild(actions);
          schedulesEl.appendChild(article);
        }
      }

      async function selectJob(id) {
        selectedId = selectedId === id ? null : id;
        selectedDetail = null;
        await refreshJobs();
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showError("");
        submitBtn.disabled = true;
        try {
          const res = await fetch("/api/createJob", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: urlInput.value.trim() }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => null);
            const detail =
              body && body.detail
                ? typeof body.detail === "string"
                  ? body.detail
                  : "Invalid URL"
                : `Request failed (${res.status})`;
            throw new Error(detail);
          }
          const job = await res.json();
          selectedId = job.id;
          urlInput.value = "";
          await refreshJobs();
        } catch (err) {
          showError(err.message || String(err));
        } finally {
          submitBtn.disabled = false;
        }
      });

      scheduleForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        showError("");
        scheduleBtn.disabled = true;
        try {
          const res = await fetch("/api/createJob", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              url: scheduleUrlInput.value.trim(),
              scheduled_at: new Date(scheduleAtInput.value).toISOString(),
            }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => null);
            const detail =
              body && body.detail
                ? typeof body.detail === "string"
                  ? body.detail
                  : "Invalid URL"
                : `Request failed (${res.status})`;
            throw new Error(detail);
          }
          scheduleUrlInput.value = "";
          scheduleAtInput.value = "";
          await refreshJobs();
        } catch (err) {
          showError(err.message || String(err));
        } finally {
          scheduleBtn.disabled = false;
        }
      });

      document.getElementById("schedule-tz-hint").textContent =
        localTimezoneHint();
      window.addEventListener("hashchange", applyView);
      applyView();
      refreshJobs().catch((err) => showError(err.message || String(err)));
      setInterval(() => {
        refreshJobs().catch(() => {});
      }, 2000);
    </script>
  </body>
</html>
